<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevJobs - Empleos</title>
    <link rel="stylesheet" href="empleos.css">
</head>
<body>
        <header>
            <h1>
              <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                 viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                 <polyline points="16 18 22 12 16 6"></polyline>
                 <polyline points="8 6 2 12 8 18"></polyline>
              </svg>
              DevJobs
            </h1>

            <nav>
                <a href="/home-html-css/index.html">Inicio</a>
                <a href="empleos.html">Empleos</a>
                <a href="">Empresas</a>
                <a href="">Salarios</a>
            </nav>

            <div>
                <a id="cv-publicar" href="">Subir CV</a>
            </div>
    </header>

    <main>
        <section class="jobs-search">
            <h1>Encuentra tu próximo trabajo</h1>
            <p>Explora miles de oportunidades en el sector tecnologico</p>

            <form role="search" id="empleos-search-form">
                <div class="search-bar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" 
                        height="24" 
                        viewBox="0 0 24 24" 
                        fill="none" 
                        stroke="currentColor" 
                        stroke-width="1" 
                        stroke-linecap="round" 
                        stroke-linejoin="round" 
                        class="icon icon-tabler icons-tabler-outline icon-tabler-search">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" /><path d="M21 21l-6 -6" />
                    </svg>

                    <input type="text" id="search-input-empleos" name="search" placeholder="Buscar trabajos, empresa o habilidades" required>
                </div>

                <div class="search-filters">
                    <select name="technology" id="technology-filter">
                        <option value="">Tecnologia</option>
                        <optgroup label="Tecnologias populares">
                            <option value="JS">JavaScript</option>
                            <option value="python">Python</option>
                            <option value="react">React</option>
                            <option value="nodejs">Node.js</option>
                        </optgroup>
                        <option value="java">Java</option>
                        <hr />
                        <option value="csharp">C#</option>
                        <option value="c">C</option>
                        <option value="c++">C++</option>
                        <hr />
                        <option value="ruby">Ruby</option>
                        <option value="php">PHP</option>
                    </select>

                    <select name="location" id="filter-location">
                        <option value="">Ubicacion</option>
                        <option value="remoto">Remoto</option>
                        <option value="bsas">Buenos Aires</option>
                        <option value="cdmx">Ciudad de Mexico</option>
                        <option value="monterrey">Monterrey</option>
                        <option value="brasilia">Brasilia</option>
                        <option value="Londres">Londres</option>
                        <option value="Barcelona">Barcelona</option>
                    </select>

                    <select name="contract" id="typeof-contract-filter">
                        <option value="">Tipo de contrato</option>
                        <option value="fijo">Plazo fijo</option>
                        <option value="parcial">Tiempo parcial</option>
                        <option value="temporal">Por temporada</option>
                        <option value="eventual">Eventual</option>
                    </select>

                    <select name="experience-level" id="experience-level-filter">
                        <option value="">Nivel de experiencia</option>
                        <option value="junior">Junior</option>
                        <option value="mid">Mid-level</option>
                        <option value="senior">Senior</option>
                        <option value="lead">Lead</option>
                    </select>
                </div>
            </form>

            <span id="filter-selected-value"></span>
        </section>

        <section>
            <h2>Resultados de busqueda</h2>
            <div id="jobs-container">
                <!--contenedor dinamico-->
            </div>
            
            <nav class="pagination">
                <a href="#">
                    <svg xmlns="http://www.w3.org/2000/svg" 
                         width="24" 
                        height="24" 
                         viewBox="0 0 24 24" 
                        fill="none" 
                        stroke="currentColor" 
                        stroke-width="1" 
                        stroke-linecap="round" 
                        stroke-linejoin="round" 
                        class="icon icon-tabler icons-tabler-outline icon-tabler-chevron-left">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M15 6l-6 6l6 6" />
                    </svg>
                </a>

                <a href="#" class="is-active">1</a>
                <a href="#">2</a>
                <a href="#">3</a>
                <a href="#">4</a>
                <a href="#">5</a>

                <a href="#">
                    <svg xmlns="http://www.w3.org/2000/svg" 
                        width="24" 
                        height="24" 
                        viewBox="0 0 24 24" 
                        fill="none" 
                        stroke="currentColor" 
                        stroke-width="1" 
                        stroke-linecap="round" 
                        stroke-linejoin="round" 
                        class="icon icon-tabler icons-tabler-outline icon-tabler-chevron-right">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M9 6l6 6l-6 6" />
                    </svg>
                </a>
            </nav>
        </section>
    </main>

    <footer style="padding-bottom: 2000px;">
      <small>&copy; 2025 DevJobs. Todos los derechos reservados.</small>
    </footer>
</body>
</html>
